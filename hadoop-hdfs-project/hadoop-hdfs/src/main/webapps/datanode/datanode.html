<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link rel="stylesheet" type="text/css" href="/static/bootstrap-5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="/static/hadoop.css" />
  <title>DataNode Information</title>
</head>
<body>

<header class="navbar navbar-expand-lg navbar-dark bs-docs-nav" role="banner">
  <div class="container">
    <div class="custom-navbar-header">
      <div class="custom-navbar-brand">Hadoop</div>
    </div>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav" id="ui-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <a class="nav-link" href="#tab-overview" aria-selected="false" tabindex="-1" role="tab">Overview</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            Utilities
          </a>
          <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" href="logs/">Logs</a></li>
            <li><a class="dropdown-item" href="logLevel">Log Level</a></li>
            <li><a class="dropdown-item" href="jmx">Metrics</a></li>
            <li><a class="dropdown-item" href="conf">Configuration</a></li>
            <li><a class="dropdown-item" href="stacks">Process Thread Dump</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</header>

<div class="container">

  <div id="alert-panel">
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      <div class="alert-body" id="alert-panel-body"></div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  </div>

  <div class="tab-content">
    <div class="tab-pane" id="tab-overview"></div>
  </div>

  <div class="row">
    <hr />
    <div class="col-xs-2"><p>Hadoop, {release-year-token}.</p></div>
  </div>
</div>

<script type="text/x-dust-template" id="tmpl-dn">
  {#dn}
  <div class="page-header"><h1>DataNode on <small>{HostName}:{DataPort}</small></h1></div>
  <table class="table table-bordered table-striped">
    <tr><th>Cluster ID:</th><td>{ClusterId}</td></tr>
    <tr><th>Started:</th><td>{DNStartedTimeInMillis|date_tostring}</td></tr>
    <tr><th>Version:</th><td>{Version}</td></tr>
  </table>
  {/dn}

  <div class="page-header"><h1>Block Pools</h1></div>
  <table class="table">
    <thead>
    <tr>
      <th>Namenode Address</th>
      <th>Namenode HA State</th>
      <th>Block Pool ID</th>
      <th>Actor State</th>
      <th>Last Heartbeat Sent</th>
      <th>Last Heartbeat Response</th>
      <th>Last Block Report</th>
      <th>Last Block Report Size (Max Size)</th>
    </tr>
    </thead>
    {#dn.BPServiceActorInfo}
    <tr>
      <td>{NamenodeAddress}</td>
      <td>{NamenodeHaState}</td>
      <td>{BlockPoolID}</td>
      <td>{ActorState}</td>
      <td>{LastHeartbeat}s</td>
      <td>{LastHeartbeatResponseTime}s</td>
      <td>{#helper_relative_time value="{LastBlockReport}"/}</td>
      <td>{maxBlockReportSize|fmt_bytes} ({maxDataLength|fmt_bytes})</td>
    </tr>
    {/dn.BPServiceActorInfo}
  </table>

  <div class="page-header"><h1>Volume Information</h1></div>
  <table class="table">
    <thead>
    <tr>
      <th>Directory</th>
      <th>StorageType</th>
      <th>Capacity Used</th>
      <th>Capacity Left</th>
      <th>Capacity Reserved</th>
      <th>Reserved Space for Replicas</th>
      <th>Blocks</th>
    </tr>
    </thead>
    {#dn.VolumeInfo}
    <tr>
      <td>{name}</td>
      <td>{storageType}</td>
      <td>{usedSpace|fmt_bytes}</td>
      <td>{freeSpace|fmt_bytes}</td>
      <td>{reservedSpace|fmt_bytes}</td>
      <td>{reservedSpaceForReplicas|fmt_bytes}</td>
      <td>{numBlocks}</td>
    </tr>
    {/dn.VolumeInfo}
</script>

<script type="text/javascript" src="/static/jquery-3.7.1.min.js"></script>
<script type="text/javascript" src="/static/bootstrap-5.3.3/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="/static/moment.min.js"></script>
<script type="text/javascript" src="/static/dust-full-2.0.0.min.js"></script>
<script type="text/javascript" src="/static/dust-helpers-1.1.1.min.js"></script>
<script type="text/javascript" src="/static/dfs-dust.js"></script>
<script type="text/javascript" src="dn.js"></script>

</body>
</html>
